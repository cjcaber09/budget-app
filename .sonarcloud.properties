# Automatic analysis reads this configuration from the default branch.
# Exclude maintenance scripts and tests only; application/backend code remains scanned.
sonar.exclusions=scripts/**,__tests__/**,test-utils/**,**/*.test.*,**/*.spec.*,jest.setup.js
sonar.test.exclusions=__tests__/**,test-utils/**,**/*.test.*,**/*.spec.*
# These deployed migrations intentionally replace earlier function definitions.
# Exclude only copy-paste detection; keep security and correctness analysis.
sonar.cpd.exclusions=supabase/migrations/0018_phone_notifications.sql,supabase/migrations/0019_payment_methods.sql
